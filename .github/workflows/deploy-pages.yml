name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - codex/new-hp
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build generated content
        run: npm run build

      - name: Verify generated content
        run: |
          test -s assets/project-data.js
          test -s assets/publication-data.js
          test -s assets/media-data.js
          test -s creation/navitoon/index.html
          test -s 404.html
          grep -q "HRJP_PROJECTS" assets/project-data.js
          grep -q "HRJP_PUBLICATIONS" assets/publication-data.js
          grep -q "HRJP_MEDIA" assets/media-data.js

      - name: Prepare static artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html 404.html _site/
          cp -R assets creation _site/
          touch _site/.nojekyll

      - name: Verify static artifact
        run: |
          test -s _site/index.html
          test -s _site/404.html
          test -s _site/assets/main.js
          test -s _site/assets/project-data.js
          test -s _site/assets/publication-data.js
          test -s _site/assets/media-data.js
          test -s _site/creation/navitoon/index.html
          grep -q "HRJP_PROJECTS" _site/assets/project-data.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
